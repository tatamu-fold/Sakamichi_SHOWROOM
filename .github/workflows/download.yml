name: Download Handler
run-name: Download stream for ${{ inputs.url_key }}

on:
  workflow_dispatch:
    inputs:
      url_key:
        description: 'Room key to download'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Print received payload
        run: |
          echo "url_key: $URL_KEY"
        env:
          URL_KEY: ${{ inputs.url_key }}


      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.15' # Specify the Python version you need
      - name: Download FFmpeg
        run: |
          sudo apt update
          sudo apt install ffmpeg 
          ffmpeg -version

      - name: Download N_m3u8DL-RE and Stream
        run: |
          wget -O N_m3u8DL-RE.tar.gz https://github.com/nilaoda/N_m3u8DL-RE/releases/download/v0.3.0-beta/N_m3u8DL-RE_v0.3.0-beta_linux-x64_20241203.tar.gz
          tar -xzf N_m3u8DL-RE.tar.gz
          # ./N_m3u8DL-RE --live-real-time-merge "url" --save-name chunklist &
          # --live-keep-segments 
      
      - name: Run Python script
        run: |
          pip install requests pytz
          python download.py
        env:
          url_key: ${{ inputs.url_key }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

